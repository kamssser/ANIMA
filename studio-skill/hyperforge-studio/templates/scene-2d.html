<!doctype html>
<!-- Templat adegan 2D (canvas). Salin ke <proyek>/index.html lalu ganti isinya.
     Aturan: semua gambar fungsi murni dari t; ukuran & fps sesuai styles/<gaya>.md; subtitle dari audio/words.json. -->
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Adegan 2D</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/kit/studio-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 6;           // ganti: format & durasi dari brief / suara
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
let chunks = [];

// Shot: satu shot dikunci ke satu kalimat narasi (isi dari naskah.md + words.json).
const SHOTS = [
  { dari: 0, sampai: 3, judul: 'pembuka' },
  { dari: 3, sampai: 6, judul: 'isi' },
];

function karakter(x, y, s, t, pose) {
  // contoh karakter sederhana: badan + kepala + kedip; ganti dengan karakter dari karakter/
  const tt = HF.stepTime(t, 12);                         // gerak karakter "on twos"
  const bob = Math.sin(tt * 4) * 6 * s;
  const blink = (tt % 3.1) < 0.12;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  ctx.fillStyle = '#ffb703'; ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.roundRect(-110, -260, 220, 260, 60); ctx.fill(); ctx.stroke();
  const arm = pose === 'lambai' ? -1.9 + Math.sin(tt * 9) * 0.35 : -0.25;
  ctx.save(); ctx.translate(100, -190); ctx.rotate(arm); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 120); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#1d1d1f';
  if (blink) { ctx.fillRect(-60, -190, 40, 8); ctx.fillRect(20, -190, 40, 8); }
  else { ctx.beginPath(); ctx.arc(-40, -186, 14, 0, 7); ctx.arc(40, -186, 14, 0, 7); ctx.fill(); }
  ctx.restore();
}

HF.setup({
  width: W, height: H, fps: FPS, duration: DUR,
  async init() {
    const words = await HF.loadJSON('audio/words.json', []);   // dari anima_vibi_words
    chunks = HF.chunkWords(words, 4);
  },
  draw(t) {
    // latar bergerak pelan (tidak pernah diam)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${200 + Math.sin(t * 0.4) * 10},70%,70%)`); g.addColorStop(1, '#fff4d6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const shot = SHOTS.findIndex((s) => t >= s.dari && t < s.sampai);
    const u = HF.prog(t, SHOTS[shot].dari, SHOTS[shot].dari + 0.6);
    const x = shot === 0 ? HF.lerp(-200, W * 0.5, HF.ease.back(u)) : W * 0.5;
    karakter(x, H * 0.6, 1.4, t, shot === 1 ? 'lambai' : 'diam');
    HF.drawSubtitle(ctx, t, chunks, { keywords: new Set(['penting']) });
  },
});
</script>
</body>
</html>
