<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Low-poly cerah</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;position:absolute;left:0;top:0}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script src="/kit/studio-kit.js"></script><script src="_common.js"></script></head><body><canvas id="gl"></canvas><canvas id="ui"></canvas>
<script type="module">
import * as THREE from 'three';
const { W, H } = SAMPLE; const C = SAMPLE.warna;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ui = document.getElementById('ui'); ui.width = W; ui.height = H; const ctx = ui.getContext('2d');
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

scene.background = new THREE.Color('#bde0fe');
scene.add(new THREE.HemisphereLight('#ffffff', '#9bb', 1.3));
const sun = new THREE.DirectionalLight('#fff6e0', 2.4); sun.position.set(5, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const flat = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85 });
const ground = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.4, 0.6, 9), flat('#8ecf6b')); ground.position.y = -0.3; ground.receiveShadow = true; scene.add(ground);
for (const [x, z, s] of [[-2.6, -1.8, 1], [2.4, -2.4, 1.3], [-3.4, 0.8, 0.8], [3.2, 0.4, 0.9]]) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.8, 5), flat('#8d5a3b')); trunk.position.y = 0.4; tree.add(trunk);
  const top = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.4, 6), flat('#2a9d8f')); top.position.y = 1.4; top.castShadow = true; tree.add(top);
  tree.position.set(x, 0, z); tree.scale.setScalar(s); scene.add(tree);
}
const bulu = new THREE.Group();
const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), flat(C.badan)); body.position.y = 1.05; body.castShadow = true; bulu.add(body);
const eyeG = new THREE.SphereGeometry(0.16, 10, 8), eyeM = flat(C.mata), whiteM = flat('#ffffff');
for (const x of [-0.34, 0.34]) { const w = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), whiteM); w.position.set(x, 1.25, 0.82); bulu.add(w); const e = new THREE.Mesh(eyeG, eyeM); e.position.set(x, 1.24, 1.02); bulu.add(e); }
const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6, 5), flat(C.mata)); ant.position.set(0, 2.2, 0); bulu.add(ant);
const tip = new THREE.Mesh(new THREE.OctahedronGeometry(0.16), new THREE.MeshStandardMaterial({ color: C.aksen, emissive: C.aksen, emissiveIntensity: 0.6, flatShading: true })); tip.position.set(0, 2.55, 0); bulu.add(tip);
scene.add(bulu);
const sunMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 0), new THREE.MeshStandardMaterial({ color: '#ffd166', emissive: '#ffb703', emissiveIntensity: 0.8, flatShading: true })); sunMesh.position.set(2.2, 5.2, -4); scene.add(sunMesh);
function update(t) { const tt = HF.stepTime(t, 15); bulu.rotation.y = Math.sin(tt) * 0.3; bulu.position.y = Math.abs(Math.sin(tt * 3)) * 0.1; sunMesh.rotation.y = t * 0.5; cam.position.set(Math.sin(t * 0.3) * 0.8, 3.4, 12.5); cam.lookAt(0, 1.4, 0); }

HF.setup({ width: W, height: H, fps: 30, duration: 3, draw(t) { update(t); renderer.render(scene, cam); ctx.clearRect(0, 0, W, H); SAMPLE.sub(ctx, t); } });
</script></body></html>
