<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Explainer datar</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/kit/studio-kit.js"></script><script src="/kit/explainer-datar.js"></script></head><body><canvas id="c"></canvas>
<script>
// Contoh gaya explainer datar (16:9). Semua tokoh & benda dari kit/explainer-datar.js (XD), bukan digambar dari nol.
const W = 1920, H = 1080, FPS = 24;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const P = XD.palet;
const LATAR = '#352b24';
const rim = XD.rimUntuk(LATAR);
const words = [{ s: 0.2, e: 0.6, text: 'Kerja' }, { s: 0.6, e: 1.0, text: 'seharian,' }, { s: 1.1, e: 1.5, text: 'upahnya' }, { s: 1.5, e: 2.4, text: 'segini.' }];
HF.setup({ width: W, height: H, fps: FPS, duration: 4, draw(t) {
  // kamera: zoom pelan
  const z = 1 + 0.05 * HF.ease.inOut(HF.prog(t, 0, 4));
  ctx.save(); ctx.translate(W * 0.45, H * 0.6); ctx.scale(z, z); ctx.translate(-W * 0.45, -H * 0.6);
  XD.langit(ctx, W, H, '#2a221d', '#4a3b2e');
  XD.cahaya(ctx, 640, 330, 640, '255,214,140', 0.42);
  // dinding tambang pudar
  ctx.fillStyle = 'rgba(120,96,78,0.35)';
  for (const [x, y, r] of [[160, 300, 110], [1700, 240, 150], [1420, 520, 90], [300, 640, 70]]) { ctx.beginPath(); ctx.ellipse(x, y, r * 1.4, r, 0.2, 0, 7); ctx.fill(); }
  XD.tanah(ctx, W, H, 880, '#3b2f25');
  XD.batu(ctx, 1500, 900, 1.5, { bijih: true, rim, seed: 4 });
  XD.batu(ctx, 1730, 900, 0.9, { rim, seed: 9 });
  // tokoh tetap gaya ini (Raka, XD.PEMBAWA) menjelaskan; tokoh cerita (penambang) di kiri
  XD.pembawa(ctx, 1240, 930, 1.55, { t, pose: t < 1.6 ? 'diam' : 'tunjuk', ekspresi: t < 1.6 ? 'senyum' : 'mantap', bicara: t > 0.2 && t < 2.4, rim, hadap: -1 });
  const pose = t < 1.6 ? 'diam' : 'kepala';
  XD.tokoh(ctx, 700, 960, 2.0, { t, id: 1, kulit: P.kulit[3], gayaRambut: 'keriting', topi: 'helm', lampuNyala: true, baju: '#9cc0d6', overall: '#e2b45a', ekspresi: t < 1.6 ? 'netral' : 'sedih', pose, rim });
  const u = HF.spring(t, 1.5, 0, 1, 16, 0.5);
  XD.label(ctx, 1000, 250, 'Upah sehari: sangat kecil', { muncul: Math.max(0, u) });
  ctx.restore();
  HF.drawSubtitle(ctx, t, HF.chunkWords(words, 4), { hi: '#ffd166', size: 54, y: H * 0.92 });
} });
</script></body></html>
