<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Explainer datar</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/kit/studio-kit.js"></script><script src="_common.js"></script></head><body><canvas id="c"></canvas>
<script>
// Contoh gaya explainer datar (16:9): tokoh kepala bulat mata titik, bayangan lembut, label pil aksen, peta flat.
const W = 1920, H = 1080, FPS = 24;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };
function blob(x, y, rx, ry, c, sh = 0.84) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.save(); ctx.clip(); ctx.fillStyle = shade(c, sh); ctx.beginPath(); ctx.ellipse(x + rx * 0.45, y + ry * 0.15, rx * 0.8, ry * 1.1, 0, 0, 7); ctx.fill(); ctx.restore(); }
function pill(x, y, text, c, s = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.font = '800 46px "Segoe UI", Arial, sans-serif'; const w = ctx.measureText(text).width + 64; ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.roundRect(-w / 2 + 6, -34 + 8, w, 68, 14); ctx.fill(); ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(-w / 2, -34, w, 68, 14); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2); ctx.restore(); }
function tokoh(x, y, s, t, pose) {
  const tt = HF.stepTime(t, 12); const blink = (tt % 3.3) < 0.1; const bob = Math.sin(tt * 3) * 4;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(40,25,10,0.18)'; ctx.beginPath(); ctx.ellipse(0, 300, 150, 26, 0, 0, 7); ctx.fill();
  // badan trapesium + celana
  ctx.fillStyle = '#5b8fb0'; ctx.beginPath(); ctx.moveTo(-95, 60); ctx.lineTo(95, 60); ctx.lineTo(120, 230); ctx.lineTo(-120, 230); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade('#5b8fb0', 0.84); ctx.beginPath(); ctx.moveTo(30, 60); ctx.lineTo(95, 60); ctx.lineTo(120, 230); ctx.lineTo(50, 230); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3c4a5c'; ctx.fillRect(-100, 230, 85, 70); ctx.fillRect(15, 230, 85, 70);
  // lengan: menunjuk
  ctx.strokeStyle = '#c98b5b'; ctx.lineWidth = 26; ctx.lineCap = 'round';
  const a = pose === 'tunjuk' ? -0.55 + Math.sin(tt * 5) * 0.08 : 0.9;
  ctx.beginPath(); ctx.moveTo(80, 90); ctx.lineTo(80 + Math.cos(a) * 120, 90 + Math.sin(a) * 120); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-80, 90); ctx.lineTo(-115, 200); ctx.stroke();
  // kepala bulat besar + rambut solid
  blob(0, -60, 150, 140, '#d39a6a');
  ctx.fillStyle = '#2d2420'; ctx.beginPath(); ctx.ellipse(-10, -150, 150, 70, -0.08, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.ellipse(-120, -95, 40, 60, 0.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1512'; if (blink) { ctx.fillRect(-58, -48, 30, 5); ctx.fillRect(22, -48, 30, 5); } else { ctx.beginPath(); ctx.arc(-44, -46, 10, 0, 7); ctx.arc(38, -46, 10, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#1b1512'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-14, 12); ctx.quadraticCurveTo(0, 20, 14, 12); ctx.stroke();
  ctx.restore();
}
function peta(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.roundRect(-250 + 10, -190 + 12, 500, 380, 22); ctx.fill();
  ctx.fillStyle = '#a7c4cf'; ctx.beginPath(); ctx.roundRect(-250, -190, 500, 380, 22); ctx.fill();
  ctx.fillStyle = '#b7ad6b'; ctx.beginPath(); ctx.moveTo(-170, -120); ctx.bezierCurveTo(-40, -170, 120, -150, 170, -60); ctx.bezierCurveTo(200, 30, 130, 140, 30, 150); ctx.bezierCurveTo(-90, 160, -200, 60, -170, -120); ctx.fill();
  ctx.fillStyle = '#e2594e'; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4) ** 2; ctx.beginPath(); ctx.ellipse(40, 10, 70, 46, 0.4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#2d2420'; ctx.font = '700 26px "Segoe UI", Arial'; ctx.textAlign = 'center'; ctx.fillText('WILAYAH A', 40, 80);
  ctx.restore();
}
const words = [{ s: 0.2, e: 0.7, text: 'Kenapa' }, { s: 0.7, e: 1.2, text: 'bisa' }, { s: 1.2, e: 2.2, text: 'begitu?' }];
HF.setup({ width: W, height: H, fps: FPS, duration: 3, draw(t) {
  const z = 1 + 0.03 * HF.ease.inOut(HF.prog(t, 0, 3));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a2f29'); g.addColorStop(1, '#5e4a3a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(560, 300, 20, 560, 300, 520); glow.addColorStop(0, 'rgba(255,214,140,0.55)'); glow.addColorStop(1, 'rgba(255,214,140,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,96,78,0.55)'; for (const [x, w, h] of [[80, 220, 420], [1500, 300, 520], [1780, 180, 360]]) { ctx.beginPath(); ctx.roundRect(x, H - 200 - h, w, h, 20); ctx.fill(); }
  ctx.fillStyle = '#6d5643'; ctx.fillRect(0, H - 200, W, 200);
  tokoh(620, 560, 1.15, t, 'tunjuk');
  peta(1300, 470, 1.1, t);
  const u = HF.spring(t, 0.5, 0, 1, 16, 0.5); pill(1300, 160, 'Upah harian: 2x lebih kecil', '#e2594e', Math.max(0, u));
  ctx.restore();
  HF.drawSubtitle(ctx, t, HF.chunkWords(words, 4), { hi: '#ffd166', size: 52, y: H * 0.9 });
} });
</script></body></html>
